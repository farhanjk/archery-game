<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1d2b3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Tap &amp; Twang — Archery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-item"><span class="label">SCORE</span><span id="score">0</span></div>
      <div class="hud-item"><span class="label">ROUND</span><span id="round">1</span><span class="sep">/</span><span id="roundMax">5</span></div>
      <div class="hud-item"><span class="label">ARROWS</span><span id="arrows">3</span></div>
    </header>

    <canvas id="game"></canvas>

    <div id="hint">Drag back from the bow, aim, release to shoot</div>

    <div id="overlay" class="hidden">
      <div class="card">
        <h1 id="overTitle">🏹 Tap &amp; Twang</h1>
        <p id="overText">Drag back to draw the bow. Aim high to beat gravity. Hit the gold center for 100!</p>
        <div id="finalScore" class="hidden"></div>
        <button id="startBtn">Start</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
