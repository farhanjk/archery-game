<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1d2b3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Tap &amp; Twang — Archery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-item"><span class="label">LEVEL</span><span id="level">1</span></div>
      <div class="hud-item"><span class="label">SCORE</span><span id="score">0</span></div>
      <div class="hud-item"><span class="label">ROUND</span><span id="round">1</span><span class="sep">/</span><span id="roundMax">5</span></div>
      <div class="hud-item"><span class="label">ARROWS</span><span id="arrows">3</span></div>
    </header>

    <canvas id="game"></canvas>

    <div id="hint">Drag back from the bow, aim, release to shoot</div>

    <div id="overlay">
      <div class="card">
        <h1 id="overTitle">🏹 Tap &amp; Twang</h1>
        <p id="overText">Pick a level — drag back from the bow, aim, release to shoot.</p>
        <div id="result" class="hidden"></div>
        <div id="levelSelect">
          <button class="levelBtn" data-level="0">
            <span class="lvHead"><b>Level 1</b> · Rookie</span>
            <span class="lvDesc">Still target · no wind</span>
            <span class="lvBest" data-best="0">Best 0</span>
          </button>
          <button class="levelBtn" data-level="1">
            <span class="lvHead"><b>Level 2</b> · Archer</span>
            <span class="lvDesc">Moving target · light wind</span>
            <span class="lvBest" data-best="1">Best 0</span>
          </button>
          <button class="levelBtn" data-level="2">
            <span class="lvHead"><b>Level 3</b> · Master</span>
            <span class="lvDesc">Fast target · gusty wind · small face</span>
            <span class="lvBest" data-best="2">Best 0</span>
          </button>
          <button class="levelBtn daily" data-level="3">
            <span class="lvHead"><b>★ Today's challenge</b></span>
            <span class="lvDesc" id="dailyDesc">Same seed for everyone today</span>
            <span class="lvBest" data-best="3">Best 0</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
